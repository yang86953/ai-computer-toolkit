[package]
name = "ai-computer-toolkit"
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
description = "Capability-first computer-control toolkit for AI agents"
license = "MIT"
autobins = false

[features]
default = []
windows-workers = []
test-fixtures = []
# 发布工具只参与 Linux 制品构建与临时前缀安装，不进入主 CLI archive。
linux-release-tools = ["dep:toml"]
# Linux AT-SPI 候选只用于私有双 D-Bus 合成验收；默认 CLI 与发布包不启用。
linux-atspi-candidate = []
# Linux MPRIS 候选只允许显式私有总线验收；默认生产与发布不启用。
linux-mpris-candidate = []

[[bin]]
name = "ai-computer-toolkit"
path = "src/main.rs"

[[bin]]
name = "ai-computer-toolkit-linux-release"
path = "src/bin/ai-computer-toolkit-linux-release.rs"
required-features = ["linux-release-tools"]

[[bin]]
name = "ai-computer-toolkit-atspi-observation-worker"
path = "src/bin/ai-computer-toolkit-atspi-observation-worker.rs"
required-features = ["linux-atspi-candidate"]

[[bin]]
