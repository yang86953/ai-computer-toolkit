[dependencies]
# 使用纯 Rust RFC 4648 编码验证 WebSocket 升级握手与页面截图。
base64 = "0.22.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# 使用纯 Rust SHA-1 验证 WebSocket Sec-WebSocket-Accept。
sha1 = "0.10.6"
thiserror = "2.0.18"
# UIX 作为外部版本化依赖维护，不将其源码复制到本仓库。
# 基础输入控件依赖 feedback；显式启用它，不启用图形 backend 默认集合。
uix = { git = "https://github.com/yang86953/uix-app.git", rev = "b652c0843cd69e3ca3bdf99e8d4d4604ed60e556", default-features = false, features = ["feedback"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-future = "0.3.2"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Media_Control",
    # 使用 Windows 内建 Media Foundation 完成项目自有 H.264/MP4 编码。
    "Win32_Media_MediaFoundation",
    "Win32_Foundation",
    # 通过匿名管道读取 companion worker 的有界 JSON 输出。
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    # 只读查询 DWM 组合状态与窗口 cloaked 标记，供零帧捕获预检使用。
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    # 只读查询进程 token 完整性等级，用于公开相对关系而不泄漏 RID。
    "Win32_Security",
    # 使用系统首选随机源生成一次性 endpoint lease 和授权代际。
    "Win32_Security_Cryptography",
    # 为固定本机 pipe 建立仅 SYSTEM 与当前用户可访问的显式 DACL。
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # 把 Ctrl+C 与 Ctrl+Break 转换为 worker cancellation 信号。
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    # ReadFile/WriteFile 的同步 OVERLAPPED 类型门禁。
    "Win32_System_IO",
    # 在 worker 首条指令前绑定 KILL_ON_JOB_CLOSE Job。
    "Win32_System_JobObjects",
    "Win32_System_Ole",
    # 建立只继承 worker 端点的匿名 stdio 管道。
    "Win32_System_Pipes",
    # 只读枚举传统卸载注册源，不写注册表。
    "Win32_System_Registry",
    # 读取当前进程所属的 Windows session ID 以生成主机身份。
    "Win32_System_RemoteDesktop",
    # 只读比较当前线程桌面与输入桌面，拒绝锁屏、UAC 和非输入桌面控制。
    "Win32_System_StationsAndDesktops",
    # 读取进程创建 FILETIME 以构造可检测 PID 复用的私有窗口身份。
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    # 读取当前 Windows 用户名并与 C++ host identity 对齐。
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    # 为 UIA 物理屏幕坐标建立 Per-Monitor-V2 线程上下文。
    "Win32_UI_HiDpi",
    # 仅供工具自有兼容夹具注册固定 Raw Input 鼠标或键盘 usage。
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    # 只读枚举公开 Shell AppsFolder 应用目录。
    "Win32_UI_Shell",
    # 使用 Shell item 列举所需的公开 ITEMIDLIST 类型。
    "Win32_UI_Shell_Common",
    # 读取 AppUserModelId 属性作为私有去重事实。
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# 使用标准 D-Bus 客户端实现 XDG Desktop Portal Screenshot 请求状态机。
async-io = "2.6.0"
futures-lite = "2.6.1"
# 只在固定自进程 Workflow worker 边界安装信号处理与父进程死亡回收。
libc = "=0.2.189"
# 生产路径只通过 Portal 授权 FD 连接受限 PipeWire remote，支持单帧与有界常驻订阅。
pipewire = { version = "=0.10.1", features = ["v0_3_44"] }
# 通过标准 Portal 返回的 EIS FD 建立 sender 握手并发送有界会话级输入。
reis = { version = "0.7.1", default-features = false, features = ["async-io"] }
# 使用 fd-relative、NOFOLLOW/NONBLOCK 打开实现 Desktop Entry 安全 walker。
rustix = { version = "1.1.4", features = ["event", "fs", "net", "process", "time"] }
# Linux Release System 生成/校验 tar.zst；只进入 Linux target，Windows 依赖树不命中。
goblin = "0.10.7"
sha2 = "0.10.9"
spdx = "0.13.5"
tar = "0.4.44"
toml = { version = "1.0.4", optional = true }
zstd = "0.13.3"
url = "2.5.7"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# 用真实 Linux CLI 实例执行 Draft 2020-12 公共契约门禁，不带网络或文件解析功能。
jsonschema = { version = "0.51.0", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_unsafe = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

